name: ci-image
description: Choose the CI image for the pinned base, then publish it once or fetch it.

inputs:
  role:
    description: publish (build and push it once) or use (fetch it, or build it where there is no registry to share through).
    required: true
  image:
    description: The tag the publishing job chose. Empty for the publishing job itself.
    required: false
    default: ''
  token:
    description: Registry token, when REGISTRY is set.
    required: false
    default: ''

outputs:
  image:
    description: The image tag every job of the run uses.
    value: ${{ steps.resolve.outputs.image }}

runs:
  using: composite
  steps:
    - name: login
      if: ${{ env.REGISTRY != '' }}
      shell: bash
      env: { T: "${{ inputs.token }}", U: "${{ github.actor }}" }
      run: echo "$T" | docker login "$REGISTRY" -u "$U" --password-stdin

    # The tag is the Dockerfile's digest, and the Dockerfile pins the base image, so a new
    # GNOME arrives as the pull request that moves the pin. What is installed is printed
    # before the image is pushed or used, because a version nobody can see is how two CIs
    # came to disagree without a visible reason.
    - name: resolve
      id: resolve
      shell: bash
      env: { GIVEN: "${{ inputs.image }}" }
      run: |
        RESOLVED="$(bash .github/ci-image.sh resolve)"
        echo "$RESOLVED" >> "$GITHUB_ENV"
        echo "image=$(sed -n 's/^IMAGE=//p' <<< "$RESOLVED")" >> "$GITHUB_OUTPUT"

    - name: ${{ inputs.role }}
      shell: bash
      env: { ROLE: "${{ inputs.role }}" }
      run: bash .github/ci-image.sh "$ROLE"
