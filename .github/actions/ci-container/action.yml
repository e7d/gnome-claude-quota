name: ci-container
description: Build or pull the CI image, start a container holding this checkout, and install its dependencies.

inputs:
  name:
    description: Distinguishes this job's container from its siblings'.
    required: true
  token:
    description: Registry token, when REGISTRY is set.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: login
      if: ${{ env.REGISTRY != '' }}
      shell: bash
      env: { T: "${{ inputs.token }}", U: "${{ github.actor }}" }
      run: echo "$T" | docker login "$REGISTRY" -u "$U" --password-stdin

    # The image tracks the GNOME Arch ships today: its tag carries gnome-shell's version, so a
    # new release is a new tag, and the build is told that version so a cached layer cannot
    # hide it. What was installed is checked before it is trusted or pushed, because an image
    # that says 51.1 and holds 50.4 is the failure this exists to prevent.
    - name: image
      shell: bash
      run: |
        PACKAGE="$(curl -fsS --retry 3 https://archlinux.org/packages/extra/x86_64/gnome-shell/json/)"
        GNOME="$(jq -r '(if .epoch == 0 then "" else "\(.epoch):" end) + .pkgver + "-" + .pkgrel' <<< "$PACKAGE")"
        case "$GNOME" in
          ''|*null*) echo "cannot tell which gnome-shell Arch ships today" >&2; exit 1 ;;
        esac
        IMAGE="${REGISTRY:+$REGISTRY/}${GITHUB_REPOSITORY}-ci:$(sha256sum .github/ci.Dockerfile | cut -c1-16)-gnome-${GNOME//:/_}"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        verify() {
          INSTALLED="$(docker run --rm "$IMAGE" pacman -Q gnome-shell | cut -d' ' -f2)"
          [ "$INSTALLED" = "$GNOME" ] || { echo "$IMAGE holds gnome-shell $INSTALLED, not $GNOME" >&2; return 1; }
        }
        if [ -n "$REGISTRY" ] && docker pull "$IMAGE" 2>/dev/null; then
          verify
          exit 0
        fi
        docker build --pull --build-arg "GNOME_VERSION=$GNOME" -f .github/ci.Dockerfile -t "$IMAGE" .github
        verify
        if [ -n "$REGISTRY" ]; then
          for attempt in 1 2 3; do
            docker push "$IMAGE" && exit 0
            echo "push attempt $attempt failed" >&2
            sleep $((attempt * 15))
          done
          echo "::warning::could not push $IMAGE; this job goes on with its local copy and later jobs rebuild"
        fi

    - name: container
      shell: bash
      env: { NAME: "${{ inputs.name }}" }
      run: |
        C="claude-quota-${GITHUB_RUN_ID}-${NAME}"
        echo "C=$C" >> "$GITHUB_ENV"
        docker create --name "$C" -w /work "$IMAGE" sleep infinity
        docker cp ./. "$C":/work/
        docker start "$C"
        docker exec -u root "$C" chown -R ci:ci /work
        docker exec "$C" bash -c 'mkdir -p ~/.local/share/gnome-shell/extensions && ln -sfn /work ~/.local/share/gnome-shell/extensions/'"$UUID"
        docker exec -u root "$C" .github/logind-stub.sh

    # The base image is a rolling one on purpose — the point is to run against the GNOME
    # the distribution ships today — so what a run was measured against is worth a line.
    - name: toolchain
      shell: bash
      run: docker exec "$C" bash -c 'gnome-shell --version; node --version; npm --version'

    - name: install
      shell: bash
      run: docker exec "$C" npm ci
