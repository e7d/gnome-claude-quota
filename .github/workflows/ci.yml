name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: git.lan.e7d.io
  CI_IMAGE: git.lan.e7d.io/${{ github.repository }}-ci
  UUID: claude-quota@e7d.io

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: login
        if: ${{ github.server_url != 'https://github.com' }}
        env: { T: "${{ secrets.REGISTRY_TOKEN }}", U: "${{ github.actor }}" }
        run: echo "$T" | docker login "$REGISTRY" -u "$U" --password-stdin

      - name: image
        env:
          CACHED: ${{ github.server_url != 'https://github.com' }}
        run: |
          IMAGE="$CI_IMAGE:$(sha256sum .github/ci.Dockerfile | cut -c1-16)"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          if [ "$CACHED" = 'true' ] && docker pull "$IMAGE" 2>/dev/null; then
            exit 0
          fi
          docker build -f .github/ci.Dockerfile -t "$IMAGE" .github
          if [ "$CACHED" = 'true' ]; then
            docker push "$IMAGE"
          fi

      - name: setup
        run: |
          C="claude-quota-${GITHUB_RUN_ID}"
          echo "C=$C" >> $GITHUB_ENV
          docker create --name "$C" -w /work "$IMAGE" sleep infinity
          docker cp ./. "$C":/work/
          docker start "$C"
          docker exec -u root "$C" chown -R ci:ci /work
          docker exec "$C" bash -c 'mkdir -p ~/.local/share/gnome-shell/extensions && ln -sfn /work ~/.local/share/gnome-shell/extensions/'"$UUID"
          docker exec -u root "$C" .github/logind-stub.sh

      - name: install
        run: docker exec "$C" npm ci

      - name: lint
        run: docker exec "$C" npm run lint

      - name: shellcheck
        run: docker exec "$C" bash -c 'shellcheck -x tools/*.sh tools/lib/*.sh'

      - name: test
        run: docker exec "$C" npm test

      - name: e2e
        run: docker exec "$C" npm run e2e -- --a11y

      - name: a11y
        run: docker exec "$C" npm run a11y

      - name: cleanup
        if: always()
        run: docker rm -f "$C" 2>/dev/null || true
